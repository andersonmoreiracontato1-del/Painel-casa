<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080c14">
<title>Casa Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
:root {
  --bg:#080c14; --card:#111827; --card2:#1a2438;
  --border:rgba(255,255,255,0.07);
  --amber:#fbbf24; --cyan:#22d3ee; --white:#ffffff; --muted:#8896a8;
  --mono:'DM Mono',monospace;
}
html,body { height:100%; width:100%; overflow:hidden; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--white); position:fixed; top:0; left:0; }
.page { height:100vh; width:100%; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding:32px 20px 48px; background:radial-gradient(ellipse 100% 35% at 50% 0%,#1c3a5a28,transparent),var(--bg); }
.page::-webkit-scrollbar{display:none;}
.top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; }
.clock .time { font-family:var(--mono); font-size:52px; font-weight:500; letter-spacing:-3px; line-height:1; color:var(--white); }
.clock .date { font-size:15px; color:var(--white); margin-top:7px; }
.weather { text-align:right; }
.weather .temp { font-family:var(--mono); font-size:44px; font-weight:400; color:var(--white); line-height:1; }
.weather .city { font-size:14px; color:var(--white); margin-top:7px; line-height:1.5; text-align:right; }
.line { height:1px; background:var(--border); margin-bottom:28px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:18px 16px 16px; cursor:pointer; transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1),border-color 0.3s,background 0.3s; position:relative; overflow:hidden; }
.card::before { content:''; position:absolute; top:0; left:15%; right:15%; height:1px; border-radius:1px; opacity:0; transition:opacity 0.3s; }
.card:active{transform:scale(0.93);}
.card.on.amber { background:linear-gradient(160deg,#111827,#1f1a0a); border-color:rgba(251,191,36,0.25); }
.card.on.cyan  { background:linear-gradient(160deg,#111827,#0c1e2a); border-color:rgba(34,211,238,0.25); }
.card.on.amber::before{background:var(--amber);opacity:0.7;}
.card.on.cyan::before {background:var(--cyan); opacity:0.7;}
.card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.icon { width:48px; height:48px; border-radius:15px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:24px; transition:box-shadow 0.3s,background 0.3s; }
.card.on.amber .icon{background:rgba(251,191,36,0.15);box-shadow:0 0 20px rgba(251,191,36,0.22);}
.card.on.cyan  .icon{background:rgba(34,211,238,0.15);box-shadow:0 0 20px rgba(34,211,238,0.22);}
.pill { width:40px; height:24px; border-radius:12px; background:var(--card2); border:1px solid rgba(255,255,255,0.08); position:relative; transition:background 0.3s; flex-shrink:0; }
.pill::after { content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:3px; left:3px; transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 1px 4px rgba(0,0,0,0.5); }
.pill.on::after{transform:translateX(16px);}
.pill.on.amber{background:var(--amber);}
.pill.on.cyan {background:var(--cyan);}
.card-name{font-size:16px;font-weight:600;color:var(--white);}
.card-sub {font-size:12px;color:var(--muted);margin-top:4px;transition:color 0.3s;}
.card.on.amber .card-sub{color:var(--amber);}
.card.on.cyan  .card-sub{color:var(--cyan);}
.slider { -webkit-appearance:none; width:100%; height:3px; border-radius:2px; background:var(--card2); margin-top:14px; outline:none; display:none; }
.card.on .slider{display:block;}
.slider::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 0 5px rgba(0,0,0,0.5); }

.ss-overlay { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.0) 35%,rgba(0,0,0,0.72) 100%); }
.ss-body{position:relative;z-index:2;text-align:center;}
.ss-time { font-family:var(--mono); font-size:88px; font-weight:400; letter-spacing:-5px; line-height:1; color:#fff; text-shadow:0 2px 40px rgba(0,0,0,0.9); }
.ss-date{font-size:15px;color:rgba(255,255,255,0.7);margin-top:10px;text-transform:uppercase;letter-spacing:3px;}
.ss-city{font-size:12px;color:rgba(255,255,255,0.4);margin-top:5px;letter-spacing:2px;text-transform:uppercase;}
.ss-pills{display:flex;gap:14px;justify-content:center;margin-top:44px;}
.ss-pill { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:10px 18px; backdrop-filter:blur(14px); }
.ss-pill .v{font-family:var(--mono);font-size:22px;color:#fff;}
.ss-pill .l{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}
.ss-tap{position:absolute;bottom:28px;font-size:10px;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:2px;animation:tap 3s ease-in-out infinite;}
@keyframes tap{0%,100%{opacity:0.2}50%{opacity:0.6}}

/* TOAST */
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(10px); background:#1a2438; border:1px solid rgba(57,224,122,0.3); color:#39e07a; padding:10px 22px; border-radius:20px; font-size:13px; font-weight:600; opacity:0; transition:all 0.25s; pointer-events:none; white-space:nowrap; z-index:200; }
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="clock">
      <div class="time" id="cTime">00:00</div>
      <div class="date" id="cDate">---</div>
    </div>
    <div class="weather">
      <div class="temp">24°</div>
      <div class="city">Abreu e Lima<br>Planalto</div>
    </div>
  </div>
  <div class="line"></div>
  <div class="grid">
    <div class="card on amber" id="d-ref" onclick="toggle('ref','amber','5 ligados','Desligados')">
      <div class="card-top">
        <div class="icon">💡</div>
        <div class="pill on amber" id="p-ref"></div>
      </div>
      <div class="card-name">Refletores</div>
      <div class="card-sub" id="s-ref">5 ligados</div>
      <input type="range" class="slider" value="80">
    </div>
    <div class="card" id="d-tv" onclick="toggle('tv','cyan','Ligada','Desligada')">
      <div class="card-top">
        <div class="icon">📺</div>
        <div class="pill cyan" id="p-tv"></div>
      </div>
      <div class="card-name">TV Roku</div>
      <div class="card-sub" id="s-tv">Desligada</div>
      <input type="range" class="slider" value="60">
    </div>
  </div>
</div>

<!-- SCREENSAVER -->
<div class="ss" id="ss" onclick="wakeUp()">
  <div class="ss-bg"></div>
  <div class="ss-overlay"></div>
  <div class="ss-body">
    <div class="ss-time" id="ssTime">00:00</div>
    <div class="ss-date" id="ssDate">---</div>
    <div class="ss-city">Abreu e Lima · Planalto</div>
    <div class="ss-pills">
      <div class="ss-pill"><div class="v" id="ssActive">1</div><div class="l">Ativos</div></div>
      <div class="ss-pill"><div class="v">24°</div><div class="l">Temp</div></div>
    </div>
  </div>
  <div class="ss-tap">Toque para voltar</div>
</div>

<div class="toast" id="toastEl"></div>

<script>
let active=1, ssTimer;

function tick(){
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0');
  const m=String(n.getMinutes()).padStart(2,'0');
  const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const t=h+':'+m;
  const d=days[n.getDay()]+', '+n.getDate()+' de '+months[n.getMonth()];
  document.getElementById('cTime').textContent=t;
  document.getElementById('cDate').textContent=d;
  document.getElementById('ssTime').textContent=t;
  document.getElementById('ssDate').textContent=d;
}
tick(); setInterval(tick,10000);

function toggle(key,color,onTxt,offTxt){
  const card=document.getElementById('d-'+key);
  const pill=document.getElementById('p-'+key);
  const sub=document.getElementById('s-'+key);
  const isOn=card.classList.contains('on');
  if(isOn){ card.classList.remove('on',color); pill.classList.remove('on'); sub.textContent=offTxt; active=Math.max(0,active-1); }
  else { card.classList.add('on',color); pill.classList.add('on'); sub.textContent=onTxt; active++; }
  document.getElementById('ssActive').textContent=active;
}

function resetTimer(){
  clearTimeout(ssTimer);
  ssTimer=setTimeout(()=>{ document.getElementById('ss').classList.add('show'); },60000);
}
function wakeUp(){ document.getElementById('ss').classList.remove('show'); resetTimer(); }
document.addEventListener('touchstart',resetTimer,{passive:true});
document.addEventListener('click',resetTimer);
resetTimer();

function toast(msg){ const t=document.getElementById('toastEl'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
</script>
</body>
</html>
