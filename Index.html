<title>Casa Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
:root{
  --bg:#080c14;--card:#111827;--card2:#1a2438;
  --border:rgba(255,255,255,0.07);
  --amber:#fbbf24;--amber-glow:rgba(251,191,36,0.4);
  --green:#4ade80;--green-glow:rgba(74,222,128,0.4);
  --cyan:#22d3ee;--cyan-glow:rgba(34,211,238,0.4);
  --purple:#a78bfa;--purple-glow:rgba(167,139,250,0.4);
  --white:#ffffff;--muted:#8896a8;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;width:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);position:fixed;top:0;left:0;}
.page{height:100vh;width:100%;overflow:hidden;padding:24px 18px 24px;background:radial-gradient(ellipse 100% 35% at 50% 0%,#1c3a5a28,transparent),var(--bg);display:flex;flex-direction:column;}
.page::-webkit-scrollbar{display:none;}

/* HEADER */
.header{width:100%;margin-bottom:18px;}

/* RELÓGIO com estado de hold */
.clock{
  font-family:var(--mono);
  font-size:clamp(4rem,20vw,6rem);
  font-weight:500;
  letter-spacing:-4px;
  line-height:1;
  color:var(--white);
  text-shadow:0 0 40px rgba(255,255,255,0.08);
  cursor:pointer;
  transition:color 0.3s, text-shadow 0.3s;
  display:inline-block;
  position:relative;
}
.clock.holding{
  color: rgba(255,255,255,0.4);
  text-shadow: 0 0 40px rgba(255,255,255,0.03);
}

/* Barra de progresso do hold */
.clock-progress{
  position:absolute;
  bottom:-6px;
  left:0;
  height:2px;
  width:0%;
  background:rgba(255,255,255,0.3);
  border-radius:2px;
  transition:none;
}
.clock-progress.animating{
  transition:width 3s linear;
  width:100%;
}

.weekday{font-size:clamp(1.8rem,9vw,2.6rem);font-weight:700;color:var(--white);margin-top:4px;text-transform:capitalize;letter-spacing:-0.5px;line-height:1;}
.date-location{font-size:clamp(1rem,5vw,1.3rem);font-weight:600;color:var(--white);margin-top:5px;text-transform:capitalize;opacity:0.9;}

.line{width:100%;height:1px;background:var(--border);margin-bottom:18px;}

/* GRID 2x2 */
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;width:100%;flex:1;min-height:0;}
.grid-wrap{display:flex;flex-direction:column;width:100%;flex:1;gap:12px;min-height:0;max-height:calc(100vh - 200px);}
.card-full{grid-column:1 / -1;}
.card-player{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px 20px;cursor:pointer;transition:transform 0.18s,border-color 0.3s,box-shadow 0.3s;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;max-height:70px;flex-shrink:0;}
.card-player:active{transform:scale(0.97);}
.card-player .icon{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.card-player .info{display:flex;flex-direction:column;}
.card-player .card-name{font-size:15px;font-weight:600;color:var(--purple);}
.card-player .card-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.05em;}

.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 18px 24px;cursor:pointer;transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1),border-color 0.3s,box-shadow 0.3s;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%;}
.card::before{content:'';position:absolute;inset:0;border-radius:24px;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.card:active{transform:scale(0.96);}

.card.on.amber{border-color:rgba(251,191,36,0.3);box-shadow:0 0 30px var(--amber-glow),inset 0 0 20px rgba(251,191,36,0.05);}
.card.on.amber::before{background:radial-gradient(ellipse at center,var(--amber-glow) 0%,transparent 70%);opacity:1;}
.card.on.green{border-color:rgba(74,222,128,0.3);box-shadow:0 0 30px var(--green-glow),inset 0 0 20px rgba(74,222,128,0.05);}
.card.on.green::before{background:radial-gradient(ellipse at center,var(--green-glow) 0%,transparent 70%);opacity:1;}
.card.on.cyan{border-color:rgba(34,211,238,0.3);box-shadow:0 0 30px var(--cyan-glow),inset 0 0 20px rgba(34,211,238,0.05);}
.card.on.cyan::before{background:radial-gradient(ellipse at center,var(--cyan-glow) 0%,transparent 70%);opacity:1;}
.card.on.purple{border-color:rgba(167,139,250,0.3);box-shadow:0 0 30px var(--purple-glow),inset 0 0 20px rgba(167,139,250,0.05);}
.card.on.purple::before{background:radial-gradient(ellipse at center,var(--purple-glow) 0%,transparent 70%);opacity:1;}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.icon{width:52px;height:52px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:26px;transition:all 0.3s;}
.card.on .icon{transform:scale(1.1);}
.card.on.amber .icon{background:rgba(251,191,36,0.15);box-shadow:0 0 20px var(--amber-glow);}
.card.on.green .icon{background:rgba(74,222,128,0.15);box-shadow:0 0 20px var(--green-glow);}
.card.on.cyan .icon{background:rgba(34,211,238,0.15);box-shadow:0 0 20px var(--cyan-glow);}
.card.on.purple .icon{background:rgba(167,139,250,0.15);box-shadow:0 0 20px var(--purple-glow);}

.pill{width:44px;height:26px;border-radius:13px;background:var(--card2);border:1px solid rgba(255,255,255,0.08);position:relative;transition:background 0.3s;flex-shrink:0;}
.pill::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.5);}
.pill.on::after{transform:translateX(18px);}
.pill.on.amber{background:var(--amber);}
.pill.on.green{background:var(--green);}
.pill.on.cyan{background:var(--cyan);}
.pill.on.purple{background:var(--purple);}

.card-name{font-size:8vw;font-weight:800;color:var(--white);transition:color 0.3s;text-transform:uppercase;line-height:1.1;}
.card.on.amber .card-name{color:var(--amber);}
.card.on.green .card-name{color:var(--green);}
.card.on.cyan .card-name{color:var(--cyan);}
.card.on.purple .card-name{color:var(--purple);}

.card-sub{font-family:var(--mono);font-size:4vw;font-weight:700;color:var(--white);opacity:0.7;margin-top:6px;text-transform:uppercase;letter-spacing:0.05em;transition:color 0.3s;white-space:nowrap;}
.card.on.amber .card-sub{color:var(--amber);opacity:1;}
.card.on.green .card-sub{color:var(--green);opacity:1;}
.card.on.cyan .card-sub{color:var(--cyan);opacity:1;}
.card.on.purple .card-sub{color:var(--purple);opacity:1;}


/* Esconder banner de licença do Fully */
iframe, div[style*='position:fixed'][style*='bottom'], 
#fully-license-banner, .fully-banner { display:none !important; }

/* TOAST */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card);border:1px solid rgba(57,224,122,0.3);color:#39e07a;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:rgba(239,68,68,0.3);color:#ef4444;}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="clock" id="clock" 
         onmousedown="startHold(event)" 
         ontouchstart="startHold(event)" 
         onmouseup="cancelHold()" 
         onmouseleave="cancelHold()"
         ontouchend="cancelHold()" 
         ontouchcancel="cancelHold()">
      00:00:00
      <div class="clock-progress" id="clockProgress"></div>
    </div>
    <div class="weekday" id="weekday">---</div>
    <div class="date-location" id="date-location">---</div>
  </div>

  <div class="line"></div>

  <div class="grid-wrap">
    <div class="grid">

      <div class="card amber" id="d-lamp" onclick="toggle('lamp','amber','Ligada','Desligada')">
        <div class="card-top">
          <div class="icon">💡</div>
          <div class="pill amber" id="p-lamp"></div>
        </div>
        <div class="card-name">Lâmpada Sala</div>
        <div class="card-sub" id="s-lamp">Desligada</div>
      </div>

      <div class="card on green" id="d-ref" onclick="toggle('ref','green','5 ligados','Desligados')">
        <div class="card-top">
          <div class="icon">🔦</div>
          <div class="pill on green" id="p-ref"></div>
        </div>
        <div class="card-name">Refletores</div>
        <div class="card-sub" id="s-ref">5 ligados</div>
      </div>

      <div class="card" id="d-tv" onclick="toggleTV()">
        <div class="card-top">
          <div class="icon">📺</div>
          <div class="pill cyan" id="p-tv"></div>
        </div>
        <div class="card-name">Televisão</div>
        <div class="card-sub" id="s-tv">Desligada</div>
      </div>

      <div class="card" id="d-music" onclick="openMusic()">
        <div class="card-top">
          <div class="icon">🎶</div>
        </div>
        <div class="card-name">Música</div>
        <div class="card-sub" id="s-music">YouTube · Playlist</div>
      </div>

    </div>

    <div class="card-player" id="d-player" onclick="togglePlayer()" style="display:none;">
      <div class="icon">⏯</div>
      <div class="info">
        <div class="card-name">Play / Pause</div>
        <div class="card-sub" id="s-player">Controlar música</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
const ROKU_IP = '192.168.0.125';
const YOUTUBE_PLAYLIST = 'OUN0st_eWBI';
const TG_TOKEN = '8694647682:AAGQrXfrCD6kjGwzx1eZpmN0r-hxHnWlLj8';
const TG_CHAT  = '6952099836';

// Fully Kiosk — porta padrão 2323, senha definida nas configs do Fully
// Deixe FULLY_PASSWORD vazio se não tiver senha configurada no Fully
// Fully JS Interface — gratuito, sem necessidade de REST API

let tvOn = false;
let musicOpen = false;
let relatorioEnviadoHoje = false;

// CONTADORES
const count = { lamp:0, ref:0, tv:0, music:0 };

const NTFY_TOPIC = 'painel_anderson_2025';

// ─── HOLD NO RELÓGIO — sai do Fully Kiosk ───────────────────────────────────
let holdTimer = null;
let holdStarted = false;

function startHold(e){
  // evita disparar o toggle de outros elementos
  e.stopPropagation();
  if(holdStarted) return;
  holdStarted = true;

  const clockEl = document.getElementById('clock');
  const progressEl = document.getElementById('clockProgress');

  clockEl.classList.add('holding');

  // Inicia animação da barra
  progressEl.style.transition = 'none';
  progressEl.style.width = '0%';
  // força reflow
  progressEl.offsetWidth;
  progressEl.classList.add('animating');

  holdTimer = setTimeout(() => {
    exitKiosk();
  }, 3000);
}

function cancelHold(){
  if(!holdStarted) return;
  holdStarted = false;
  clearTimeout(holdTimer);

  const clockEl = document.getElementById('clock');
  const progressEl = document.getElementById('clockProgress');

  clockEl.classList.remove('holding');
  progressEl.classList.remove('animating');
  progressEl.style.transition = 'width 0.2s ease';
  progressEl.style.width = '0%';
}

function exitKiosk(){
  cancelHold();
  toast('🔓 Saindo do kiosk...');
  try {
    if(typeof fully !== 'undefined'){
      fully.exitKiosk();
    } else {
      toast('⚠ Fully não detectado', true);
    }
  } catch(e){
    toast('⚠ Erro ao sair', true);
  }
}
// ────────────────────────────────────────────────────────────────────────────

function tgNotify(msg){
  fetch('https://ntfy.sh/'+NTFY_TOPIC, {
    method:'POST',
    body: msg
  }).catch(()=>{});
}

// MONITORAMENTO DE BATERIA
async function monitorBateria(){
  if(!('getBattery' in navigator)) return;
  const bat = await navigator.getBattery();
  function verificar(){
    const pct = Math.round(bat.level * 100);
    if(pct <= 20 && !bat.charging){
      tgNotify('🔋 Bateria CRÍTICA! '+pct+'% — Conecte o carregador AGORA!');
    } else if(pct <= 30 && !bat.charging){
      tgNotify('🔋 Bateria baixa! '+pct+'% — Carregue o painel!');
    } else if(pct <= 40 && !bat.charging){
      tgNotify('🔋 Bateria em '+pct+'% — Considere carregar em breve.');
    }
  }
  bat.addEventListener('levelchange', verificar);
  verificar();
}
monitorBateria();

// RELATÓRIO DIÁRIO ÀS 10H
function checkRelatorio(){
  const n = new Date();
  if(n.getHours()===0 && n.getMinutes()===0) relatorioEnviadoHoje = false;
  if(n.getHours()===10 && n.getMinutes()===0 && !relatorioEnviadoHoje){
    const hoje = n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
    const msg =
      '📊 Relatório do Painel — '+hoje+'\n\n'+
      '💡 Lâmpada Sala: '+count.lamp+' vezes\n'+
      '🔦 Refletores: '+count.ref+' vezes\n'+
      '📺 Televisão: '+count.tv+' vezes\n'+
      '🎶 Música: '+count.music+' vezes\n\n'+
      '🏠 Casa Inteligente · Planalto';
    tgNotify(msg);
    count.lamp=0; count.ref=0; count.tv=0; count.music=0;
    relatorioEnviadoHoje = true;
  }
}
setInterval(checkRelatorio, 1000);

// AJUSTE DINÂMICO DE FONTE
function ajustarFonte(){
  const cards = document.querySelectorAll('.card-name');
  cards.forEach(el=>{
    const largura = el.parentElement.offsetWidth;
    el.style.fontSize = (largura / 7) + 'px';
  });
  const subs = document.querySelectorAll('.card-sub');
  subs.forEach(el=>{
    const largura = el.parentElement.offsetWidth;
    el.style.fontSize = (largura / 10) + 'px';
  });
}
window.addEventListener('resize', ajustarFonte);
ajustarFonte();

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq, duration=0.4, volume=0.5){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'triangle';
  filter.type = 'lowpass';
  filter.frequency.value = 2000;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function playChord(freqs, duration=0.5){
  freqs.forEach(f => playNote(f, duration, 0.35));
}

function soundLamp(){ playChord([261.6, 329.6, 392], 0.6); }
function soundRef(){ playChord([392, 493.9, 587.3], 0.5); }
function soundTV(){ playChord([329.6, 415.3, 523.3], 0.5); }
function soundMusic(){ playChord([440, 554.4, 659.3, 880], 0.7); }
function soundPlay(){ playNote(523.3, 0.2, 0.4); }

function updateClock(){
  const n = new Date();
  const h = String(n.getHours()).padStart(2,'0');
  const m = String(n.getMinutes()).padStart(2,'0');
  const s = String(n.getSeconds()).padStart(2,'0');
  const days = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const months = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  document.getElementById('clock').firstChild.textContent = h+':'+m+':'+s;
  document.getElementById('weekday').textContent = days[n.getDay()];
  document.getElementById('date-location').textContent = n.getDate()+' de '+months[n.getMonth()]+' · Planalto';
}
updateClock();
setInterval(updateClock, 1000);

function toggle(key, color, onTxt, offTxt){
  const card = document.getElementById('d-'+key);
  const pill = document.getElementById('p-'+key);
  const sub  = document.getElementById('s-'+key);
  const isOn = card.classList.contains('on');
  if(key==='lamp') soundLamp();
  if(key==='ref') soundRef();
  if(isOn){
    card.classList.remove('on',color); pill.classList.remove('on'); sub.textContent = offTxt;
    if(key==='lamp'){ count.lamp++; tgNotify('💡 Lâmpada Sala — Desligada'); }
    if(key==='ref'){  count.ref++;  tgNotify('🔦 Refletores — Desligados'); }
  } else {
    card.classList.add('on',color); pill.classList.add('on'); sub.textContent = onTxt;
    if(key==='lamp'){ count.lamp++; tgNotify('💡 Lâmpada Sala — Ligada'); }
    if(key==='ref'){  count.ref++;  tgNotify('🔦 Refletores — 5 ligados'); }
  }
}

async function toggleTV(){
  soundTV();
  tvOn = !tvOn;
  const card = document.getElementById('d-tv');
  const pill = document.getElementById('p-tv');
  const sub  = document.getElementById('s-tv');
  if(tvOn){ card.classList.add('on','cyan'); pill.classList.add('on'); sub.textContent = 'Ligada'; }
  else { card.classList.remove('on','cyan'); pill.classList.remove('on'); sub.textContent = 'Desligada'; }
  try {
    await fetch('http://'+ROKU_IP+':8060/keypress/Power', {method:'POST', mode:'no-cors'});
    toast(tvOn ? '📺 TV ligada!' : '📺 TV desligada!');
    count.tv++;
    tgNotify(tvOn ? '📺 Televisão — Ligada' : '📺 Televisão — Desligada');
  } catch(e){ toast('⚠ Verifique o Wi-Fi', true); }
}

async function openMusic(){
  soundMusic();
  const sub = document.getElementById('s-music');
  const player = document.getElementById('d-player');
  if(musicOpen){
    await fetch('http://'+ROKU_IP+':8060/keypress/Home', {method:'POST', mode:'no-cors'});
    setTimeout(()=>{ fetch('http://'+ROKU_IP+':8060/keypress/InputTuner',{method:'POST',mode:'no-cors'}); }, 800);
    player.style.display = 'none';
    sub.textContent = 'YouTube · Playlist';
    musicOpen = false;
    toast('📺 Voltando para TV');
    return;
  }
  sub.textContent = 'Abrindo...';
  player.style.display = 'flex';
  musicOpen = true;
  try {
    await fetch('http://'+ROKU_IP+':8060/launch/837?contentId='+YOUTUBE_PLAYLIST+'&mediaType=video', {method:'POST', mode:'no-cors'});
    setTimeout(()=>{ fetch('http://'+ROKU_IP+':8060/keypress/Play',{method:'POST',mode:'no-cors'}); }, 2000);
    toast('🎶 YouTube aberto!');
    count.music++;
    tgNotify('🎶 Música — YouTube aberto no painel');
  } catch(e){
    toast('⚠ Verifique o Wi-Fi', true);
  }
  setTimeout(()=>{ sub.textContent = 'YouTube · Playlist'; }, 3000);
}

async function togglePlayer(){
  soundPlay();
  try {
    await fetch('http://'+ROKU_IP+':8060/keypress/Play', {method:'POST', mode:'no-cors'});
    toast('⏯ Play / Pause');
  } catch(e){
    toast('⚠ Falha no comando', true);
  }
}

function toast(msg, isError=false){
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('data:text/javascript;base64,'+btoa(
    "self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));" +
    "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));" +
    "self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('Offline'))));"
  )).catch(()=>{});
}
</script>
</body>
</html>
